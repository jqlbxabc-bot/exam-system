<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 试卷管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            width: 90%;
            max-width: 900px;
        }
        .login-left {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .login-right {
            padding: 60px 40px;
        }
        .login-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .feature-list {
            list-style: none;
            padding: 0;
        }
        .feature-list li {
            padding: 10px 0;
            display: flex;
            align-items: center;
        }
        .feature-list li::before {
            content: "✓";
            margin-right: 15px;
            background: rgba(255,255,255,0.2);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .form-floating {
            margin-bottom: 20px;
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a3f96 100%);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="row g-0">
            <div class="col-md-5 login-left d-none d-md-flex">
                <div>
                    <h1 class="login-title">📝 试卷管理系统</h1>
                    <p class="mb-4 opacity-75">高中生智能学习助手</p>
                    <ul class="feature-list">
                        <li>智能试卷分析</li>
                        <li>错题自动整理</li>
                        <li>学习数据统计</li>
                        <li>AI学习建议</li>
                        <li>多格式上传</li>
                        <li>云端存储</li>
                    </ul>
                </div>
            </div>
            <div class="col-md-7 login-right">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">欢迎回来</h2>
                    <p class="text-muted">请登录您的账号</p>
                </div>
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-sm">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="username" name="username" 
                               placeholder="用户名" required autofocus>
                        <label for="username">用户名</label>
                    </div>
                    <div class="form-floating">
                        <input type="password" class="form-control" id="password" name="password" 
                               placeholder="密码" required>
                        <label for="password">密码</label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-login w-100 mb-3">
                        登 录
                    </button>
                </form>
                
                <div class="text-center text-muted">
                    <small>默认管理员: admin / admin123</small>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
